# =============================================================================
# Configuração Nginx para WebApp Saude Sulamerica
# Docker (Alpine) - Container
# =============================================================================

# Registrar .mjs como application/javascript (necessário para PDF.js worker)
types {
    application/javascript  mjs;
    application/javascript  js;
    text/css                css;
    text/html               html htm shtml;
    image/jpeg              jpeg jpg;
    image/png               png;
    image/svg+xml           svg svgz;
    image/gif               gif;
    image/x-icon            ico;
    font/woff               woff;
    font/woff2              woff2;
    application/json        json;
    application/octet-stream bin;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # =============================================================================
    # Compressão Gzip
    # =============================================================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        image/svg+xml
        font/woff
        font/woff2;

    # =============================================================================
    # Assets JS/MJS — Crítico: Content-Type correto para PDF.js worker
    # O browser bloqueia workers com MIME errado (nosniff enforcement)
    # =============================================================================
    location ~* \.(js|mjs)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Type "application/javascript; charset=utf-8";
        add_header X-Content-Type-Options "nosniff";
        # Permitir Cross-Origin para workers (PDF.js precisa disto)
        add_header Cross-Origin-Resource-Policy "same-origin";
        try_files $uri =404;
    }

    location ~* \.css$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
        try_files $uri =404;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # =============================================================================
    # Bloquear rotas /api/ (app 100% estático, sem backend)
    # =============================================================================
    location /api/ {
        add_header Content-Type "application/json; charset=utf-8" always;
        return 404 '{"error":"Esta aplicacao nao possui backend. A extracao de boletos e feita no browser via PDF.js."}';
    }

    # =============================================================================
    # SPA — Fallback para index.html
    # =============================================================================
    location / {
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # COOP necessário para SharedArrayBuffer (Tesseract OCR)
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        # COEP "credentialless" permite imagens externas (foto Google) 
        # e ainda habilita SharedArrayBuffer (vs "require-corp" que bloqueia tudo externo)
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
}
