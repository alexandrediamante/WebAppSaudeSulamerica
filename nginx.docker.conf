# =============================================================================
# Configuração Nginx para WebApp Saude Sulamerica
# Docker (Alpine) - Container
# =============================================================================

server {
    # Porta HTTP padrão
    listen 80;
    
    # Aceita qualquer hostname (Docker)
    server_name _;

    # Diretório raiz onde os arquivos estáticos serão servidos
    # Docker: /usr/share/nginx/html (copiado do build stage)
    root /usr/share/nginx/html;
    
    # Arquivo de índice padrão
    index index.html;

    # =============================================================================
    # Compressão Gzip - Melhora performance de transferência
    # =============================================================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml
        font/woff
        font/woff2;

    # =============================================================================
    # Headers de Segurança
    # =============================================================================
    # Previne clickjacking
    add_header X-Frame-Options "SAMEORIGIN" always;
    
    # Previne MIME type sniffing
    add_header X-Content-Type-Options "nosniff" always;
    
    # Habilita proteção XSS do navegador
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Política de Referrer
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # =============================================================================
    # Cache de Assets Estáticos
    # =============================================================================
    # Arquivos JavaScript - cache por 1 ano (versionados pelo Vite)
    location ~* \.js$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Arquivos CSS - cache por 1 ano (versionados pelo Vite)
    location ~* \.css$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Imagens e fontes - cache por 1 ano
    location ~* \.(jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Assets com hash no nome (gerados pelo Vite) - cache permanente
    location ~* \.[a-f0-9]{8,}\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # =============================================================================
    # Configuração SPA - Fallback para index.html
    # =============================================================================
    location / {
        # Tenta servir o arquivo solicitado, senão redireciona para index.html
        try_files $uri $uri/ /index.html;
        
        # Cache curto para o HTML principal (para permitir atualizações)
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    # =============================================================================
    # Logs (stdout/stderr para Docker)
    # =============================================================================
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
}

