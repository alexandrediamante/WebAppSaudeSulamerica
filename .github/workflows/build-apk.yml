name: Build Android APK

on:
  push:
    branches: [ "feature/dashboard-rateio-saude-mvc" ]
  workflow_dispatch:

env:
  ANDROID_HOME: C:\Users\alexandre\AppData\Local\Android\Sdk
  JAVA_HOME: C:\Program Files\Eclipse Adoptium\jdk-21.0.11.10-hotspot

jobs:
  build:
    runs-on: [self-hosted, windows, android-build]

    steps:
    - uses: actions/checkout@v3

    - name: Setup Node.js path
      shell: powershell
      run: |
        $env:Path += ";C:\Program Files\nodejs;C:\Program Files\Git\cmd"
        echo "PATH=$env:Path" >> $env:GITHUB_ENV

    - name: Install dependencies and build Web
      shell: powershell
      working-directory: ./mobile-app
      run: |
        $env:Path += ";C:\Program Files\nodejs"
        npm install
        npm run build

    - name: Sync Capacitor
      shell: powershell
      working-directory: ./mobile-app
      run: |
        $env:Path += ";C:\Program Files\nodejs"
        npx cap sync android

    - name: Write local.properties
      shell: powershell
      working-directory: ./mobile-app/android
      run: |
        "sdk.dir=C:/Users/alexandre/AppData/Local/Android/Sdk" | Out-File -FilePath local.properties -Encoding utf8

    - name: Build APK
      shell: powershell
      working-directory: ./mobile-app/android
      run: |
        $env:ANDROID_HOME = "C:\Users\alexandre\AppData\Local\Android\Sdk"
        $env:JAVA_HOME = "C:\Program Files\Eclipse Adoptium\jdk-21.0.11.10-hotspot"
        $env:Path += ";$env:JAVA_HOME\bin;$env:ANDROID_HOME\platform-tools;C:\Program Files\nodejs"
        .\gradlew.bat assembleDebug

    - name: Salvar APK em pasta de saída
      shell: powershell
      run: |
        $apkSrc = "C:\Adsystem\actions-runner\_work\WebAppSaudeSulamerica\WebAppSaudeSulamerica\mobile-app\android\app\build\outputs\apk\debug\ADSplitSaudeSulameria.apk"
        $apkOut = "C:\Adsystem\WebAppSaudeSulamerica\mobile-app\ADSplitSaudeSulameria.apk"
        Copy-Item $apkSrc $apkOut -Force
        $size = [math]::Round((Get-Item $apkOut).Length / 1MB, 2)
        Write-Host "=========================================="
        Write-Host " APK GERADO COM SUCESSO!"
        Write-Host " Tamanho: $size MB"
        Write-Host " Local: $apkOut"
        Write-Host "=========================================="
