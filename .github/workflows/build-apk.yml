name: Build Android APK

on:
  push:
    branches: [ "feature/dashboard-rateio-saude-mvc" ]
  workflow_dispatch:

env:
  ANDROID_HOME: C:\Users\alexandre\AppData\Local\Android\Sdk
  JAVA_HOME: C:\Program Files\Eclipse Adoptium\jdk-21.0.11.10-hotspot

jobs:
  build:
    runs-on: [self-hosted, windows, android-build]

    steps:
    - uses: actions/checkout@v3

    - name: Setup Node.js path
      shell: powershell
      run: |
        $env:Path += ";C:\Program Files\nodejs;C:\Program Files\Git\cmd"
        echo "PATH=$env:Path" >> $env:GITHUB_ENV

    - name: Install dependencies and build Web
      shell: powershell
      working-directory: ./mobile-app
      run: |
        $env:Path += ";C:\Program Files\nodejs"
        npm install
        npm run build

    - name: Sync Capacitor
      shell: powershell
      working-directory: ./mobile-app
      run: |
        $env:Path += ";C:\Program Files\nodejs"
        npx cap sync android

    - name: Write local.properties
      shell: powershell
      working-directory: ./mobile-app/android
      run: |
        "sdk.dir=C:/Users/alexandre/AppData/Local/Android/Sdk" | Out-File -FilePath local.properties -Encoding utf8

    - name: Build APK
      shell: powershell
      working-directory: ./mobile-app/android
      run: |
        $env:ANDROID_HOME = "C:\Users\alexandre\AppData\Local\Android\Sdk"
        $env:JAVA_HOME = "C:\Program Files\Eclipse Adoptium\jdk-21.0.11.10-hotspot"
        $env:Path += ";$env:JAVA_HOME\bin;$env:ANDROID_HOME\platform-tools;C:\Program Files\nodejs"
        .\gradlew.bat assembleDebug

    - name: Commit APK no repositório
      shell: powershell
      run: |
        $env:Path += ";C:\Program Files\Git\cmd"
        $workspace = "C:\Adsystem\actions-runner\_work\WebAppSaudeSulamerica\WebAppSaudeSulamerica"
        Write-Host "Workspace: $workspace"
        git config --global safe.directory "*"
        Push-Location $workspace
        $apkSrc = "$workspace\mobile-app\android\app\build\outputs\apk\debug\ADSplitSaudeSulameria.apk"
        $apkDst = "$workspace\mobile-app\ADSplitSaudeSulameria.apk"
        Copy-Item $apkSrc $apkDst -Force
        Write-Host "APK copiado: $(Get-Item $apkDst | Select-Object -ExpandProperty Length) bytes"
        git config user.email "ci@github-actions"
        git config user.name "GitHub Actions - ADSplit Runner"
        git add -f "mobile-app/ADSplitSaudeSulameria.apk"
        $status = git status --porcelain "mobile-app/ADSplitSaudeSulameria.apk"
        Write-Host "Git status: $status"
        if ($status) {
          git commit -m "build: APK atualizado automaticamente via GitHub Actions"
          git push origin HEAD
          Write-Host "APK commitado com sucesso!"
        } else {
          Write-Host "APK identico ao anterior, nada a commitar."
        }
        Pop-Location
        Write-Host "Concluido!"
