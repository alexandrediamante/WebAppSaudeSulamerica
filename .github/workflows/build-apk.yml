name: Build Android APK

on:
  push:
    branches: [ "feature/dashboard-rateio-saude-mvc" ]
  workflow_dispatch:

env:
  ANDROID_HOME: C:\Users\alexandre\AppData\Local\Android\Sdk
  JAVA_HOME: C:\Program Files\Zulu\zulu-17

jobs:
  build:
    runs-on: [self-hosted, windows, android-build]

    steps:
    - uses: actions/checkout@v3

    - name: Setup Node.js path
      shell: powershell
      run: |
        $env:Path += ";C:\Program Files\nodejs;C:\Program Files\Git\cmd"
        echo "PATH=$env:Path" >> $env:GITHUB_ENV

    - name: Install dependencies and build Web
      shell: powershell
      working-directory: ./mobile-app
      run: |
        $env:Path += ";C:\Program Files\nodejs"
        npm install
        npm run build

    - name: Sync Capacitor
      shell: powershell
      working-directory: ./mobile-app
      run: |
        $env:Path += ";C:\Program Files\nodejs"
        npx cap sync android

    - name: Write local.properties
      shell: powershell
      working-directory: ./mobile-app/android
      run: |
        "sdk.dir=C:/Users/alexandre/AppData/Local/Android/Sdk" | Out-File -FilePath local.properties -Encoding utf8

    - name: Build APK
      shell: powershell
      working-directory: ./mobile-app/android
      run: |
        $env:ANDROID_HOME = "C:\Users\alexandre\AppData\Local\Android\Sdk"
        $env:JAVA_HOME = "C:\Program Files\Zulu\zulu-17"
        $env:Path += ";$env:JAVA_HOME\bin;$env:ANDROID_HOME\platform-tools"
        .\gradlew.bat assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ADSplitSaudeSulameria-APK
        path: mobile-app/android/app/build/outputs/apk/debug/*.apk
